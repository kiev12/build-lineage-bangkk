name: Build LineageOS for bangkk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Espacio en disco
        run: df -h

      - name: Instalar dependencias
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3

      - name: Configurar repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.email "kevinabelsanchezhuaman@gmail.com"
          git config --global user.name "kiev12"

      - name: Sincronizar fuentes LineageOS
        run: |
          mkdir -p ~/android/lineage
          cd ~/android/lineage
          repo init -u https://github.com/LineageOS/android.git \
            -b lineage-22.1 --git-lfs --depth=1
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

      - name: Clonar device trees
        run: |
          cd ~/android/lineage
          git clone https://github.com/TU_USUARIO/android_device_motorola_bangkk.git \
            device/motorola/bangkk
          git clone https://github.com/TU_USUARIO/android_device_motorola_sm6375-common.git \
            device/motorola/sm6375-common
          git clone https://github.com/TU_USUARIO/android_kernel_motorola_sm6375.git \
            kernel/motorola/sm6375
          git clone https://github.com/LineageOS/android_hardware_motorola.git \
            hardware/motorola

      - name: Compilar
        run: |
          cd ~/android/lineage
          source build/envsetup.sh
          breakfast bangkk
          brunch bangkk

      - name: Subir ROM compilada
        uses: actions/upload-artifact@v4
        with:
          name: lineage-bangkk
          path: ~/android/lineage/out/target/product/bangkk/lineage-*.zip
          retention-days: 7
